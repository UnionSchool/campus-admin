<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>众校通智慧校园</title>
    <script>
      /**
       * 首屏主题：在样式生效前先把 <html data-ca-theme> 定好。
       * 「自动」要读系统偏好，只能放在这里同步算一次，
       * 否则暗色系统上会先渲染亮色再切换，出现一下白闪。
       * 取值与 examples/admin/src/composables/useTheme.ts 保持一致。
       */
      ;(function () {
        try {
          var saved = localStorage.getItem('campus:theme') || 'auto'
          var dark = saved === 'dark'
            || (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-ca-theme', dark ? 'dark' : 'light')
        }
        catch (error) {
          document.documentElement.setAttribute('data-ca-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
