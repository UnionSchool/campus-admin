name: Release npm packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    strategy:
      # 按依赖顺序串行发布：icon → locale → ui → core
      max-parallel: 1
      matrix:
        package:
          - icon
          - locale
          - ui
          - core
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          # 必须先构建：typecheck 依赖各包 dist 里的类型声明
          pnpm run build:packages
          pnpm run typecheck
      - name: Publish ${{ matrix.package }}
        # 首次发布必须用 token（Trusted Publisher 只对已存在的包生效）；
        # 四个包发布成功后，去 npm 给每个包配 Trusted Publisher，就可以删掉 NODE_AUTH_TOKEN。
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            pnpm --filter "@campus-admin/${{ matrix.package }}" publish --access public --tag next --no-git-checks
          else
            pnpm --filter "@campus-admin/${{ matrix.package }}" publish --access public --no-git-checks
          fi
